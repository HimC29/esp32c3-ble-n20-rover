<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>esp32c3-ble-n20-rover Controller</title>
    <script src="//cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
</head>
<body>
    <h1>esp32c3-ble-n20-rover Controller</h1>
    <button id="connectBtn">Connect</button>

    <div id="controls">
        <button id="forwardBtn" data-key="forward">Forward</button>
        <button id="backwardBtn" data-key="backward">Backward</button>
        <button id="leftBtn" data-key="left">Left</button>
        <button id="rightBtn" data-key="right">Right</button>
    </div>

    <script src="main.js"></script>
</body>
</html>
